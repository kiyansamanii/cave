:root{--bg:#0a0a0b;--cd:#141416;--st:#1e1e21;--ln:#2a2a2d;--tx:#e8e4dc;--mu:#8b8984;--am:#c9a24a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.7 Estedad,sans-serif}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background:repeating-radial-gradient(#fff 0 1px,transparent 1px 3px);z-index:50}
#app{display:flex;min-height:100vh}nav{width:230px;background:var(--cd);border-left:1px solid var(--ln);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav button.l{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;margin-bottom:14px}nav button.l svg{width:38px}
nav a{display:block;padding:8px 12px;border-radius:8px;color:var(--mu);cursor:pointer;position:relative;transition:.2s}nav a:hover{color:var(--tx);background:var(--st)}nav a.on{color:var(--am);background:var(--st)}nav a.on:before{content:"";position:absolute;right:0;top:25%;height:50%;width:3px;background:var(--am);border-radius:3px}
main{flex:1;padding:22px;max-width:1000px;margin:auto;width:100%}main>*{animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
h2{font-weight:800;margin:0 0 14px}h4{margin:0 0 8px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.big{font-size:26px;font-weight:800;color:var(--am)}.mut{color:var(--mu);font-size:13px}
button,.b{font:inherit;background:var(--st);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 14px;cursor:pointer;transition:.2s}button:hover{border-color:var(--am);color:var(--am)}button.p{background:var(--am);color:#111;border-color:var(--am)}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}label{display:block;margin:8px 0 2px;color:var(--mu);font-size:13px}label.c{display:flex;gap:8px;align-items:center;color:var(--tx)}label.c input{width:auto}
form .fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}.hid{display:none}.err{color:#d9715f;min-height:22px}h5{grid-column:1/-1;margin:14px 0 0;color:var(--am)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--ln);padding:8px 0;flex-wrap:wrap}.bar{display:flex;gap:6px;align-items:flex-end;height:110px}.bar div{flex:1;text-align:center;font-size:11px}.bar i{display:block;background:var(--am);border-radius:4px 4px 0 0;min-height:2px;transition:height .8s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--st);border-radius:8px;min-height:56px;padding:4px;font-size:12px;cursor:pointer;text-align:center}.cal div.t{outline:1px solid var(--am)}.cal div.s{background:#2d2a20}.cal .h{background:none;min-height:0;color:var(--mu);cursor:default}
svg.ch{width:100%}svg.ch path.ln{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s forwards}@keyframes dr{to{stroke-dashoffset:0}}svg.ch text{fill:var(--mu);font-size:11px}
details{border-right:2px solid var(--am);padding:4px 12px;margin-bottom:10px;background:var(--cd);border-radius:8px}summary{cursor:pointer}
#wl{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 30%,#2a2620,#050505 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1s;cursor:pointer}#wl.out{opacity:0;pointer-events:none}
#wl svg{width:120px;animation:rv 2s both}#wl h1{letter-spacing:.3em;margin:10px 0;direction:ltr;animation:rv 2s .7s both;font-weight:800}#wl p{color:var(--mu);animation:rv 2s 1.6s both;max-width:420px;padding:0 20px}
#wl:before{content:"";position:absolute;width:140%;height:60%;background:radial-gradient(closest-side,rgba(201,162,74,.12),transparent);animation:fg 9s infinite alternate}@keyframes fg{to{transform:translateX(12%)}}@keyframes rv{from{opacity:0;filter:blur(8px);transform:scale(.94)}}
#tt{position:fixed;bottom:20px;left:20px;background:var(--st);border:1px solid var(--am);padding:8px 14px;border-radius:8px;z-index:60}
body.na *,body.na *:before{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01s!important;animation-delay:0s!important}}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:sticky;z-index:20;display:flex;gap:4px;overflow-x:auto;padding:8px;border:0;border-bottom:1px solid var(--ln)}nav a{white-space:nowrap}nav button.l{margin:0 0 0 8px}nav a.on:before{display:none}}

.fog{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}.fog i{position:absolute;width:65vmax;height:65vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(201,162,74,.09),transparent);filter:blur(30px);animation:f1 28s ease-in-out infinite alternate}.fog i:nth-child(2){left:-20vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(120,120,140,.08),transparent);animation:f2 34s ease-in-out infinite alternate}.fog i:nth-child(3){right:-25vmax;top:30vh;animation:f2 40s ease-in-out infinite alternate-reverse}
@keyframes f1{to{transform:translate(18vmax,12vmax) scale(1.2)}}@keyframes f2{to{transform:translate(-14vmax,-10vmax) scale(1.15)}}
.card{background:linear-gradient(160deg,rgba(32,32,36,.72),rgba(15,15,17,.72));backdrop-filter:blur(10px);position:relative;overflow:hidden;border-color:rgba(255,255,255,.07);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s,border-color .35s}.card:hover{transform:translateY(-2px);border-color:rgba(201,162,74,.35)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(201,162,74,.13),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}.card:hover:before{opacity:1}
h2{font-size:28px;background:linear-gradient(90deg,#fff,#c9a24a);-webkit-background-clip:text;background-clip:text;color:transparent}h2:after{content:"";display:block;height:2px;width:56px;background:var(--am);margin-top:6px;animation:gw 1.2s both}@keyframes gw{from{width:0}}
.big{text-shadow:0 0 26px rgba(201,162,74,.4)}nav a{transition:.3s}nav a:hover{transform:translateX(-4px)}nav a.on{background:linear-gradient(270deg,rgba(201,162,74,.18),transparent);box-shadow:inset 0 0 0 1px rgba(201,162,74,.2)}
button:active{transform:scale(.95)}button.p{box-shadow:0 0 18px rgba(201,162,74,.25)}.bar i{transform-origin:bottom;animation:gh 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gh{from{transform:scaleY(0)}}
.cal div{animation:pop .45s both;transition:transform .2s,background .2s}.cal div:hover{transform:translateY(-3px);background:#2c2a22}.cal .h{animation:none}@keyframes pop{from{opacity:0;transform:scale(.7)}}
svg.ch .ar{fill:rgba(201,162,74,.09);animation:fi 1.6s .6s both}@keyframes fi{from{opacity:0}}svg.ch .pt{transform-box:fill-box;transform-origin:center;animation:pop .45s both}
details{animation:up .6s both;transition:border-color .3s}details[open]{border-color:#fff}details[open]>*:not(summary){animation:up .45s}summary{list-style:none}summary:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--am);margin-left:10px;box-shadow:0 0 12px var(--am);animation:pl 3s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.5);opacity:.6}}
#wl canvas{position:absolute;inset:0;width:100%;height:100%}#wl>:not(canvas){position:relative;z-index:2}#wl h1{animation:rv 2s .7s both,ls 3.2s .7s both}@keyframes ls{from{letter-spacing:1.1em}}#wl svg path:nth-child(2){animation:pb 3s 1.2s infinite alternate}@keyframes pb{from{opacity:.25}to{opacity:.85}}
#wl:after{content:"";position:absolute;width:160vmax;height:160vmax;left:50%;top:-40%;margin-left:-80vmax;background:conic-gradient(from 160deg at 50% 30%,transparent 0 40%,rgba(201,162,74,.10) 46%,transparent 52% 60%,rgba(232,228,220,.06) 64%,transparent 70%);animation:sp 50s linear infinite;pointer-events:none}@keyframes sp{to{transform:rotate(360deg)}}

.rc{border-color:rgba(201,162,74,.35)}.rc .rh{margin:-14px -14px 14px;padding:16px 18px;background:linear-gradient(100deg,rgba(201,162,74,.25),transparent);border-bottom:1px solid rgba(201,162,74,.3)}.rc .rh h3{margin:2px 0 0;font-size:20px}.rc .rh small{letter-spacing:.2em;color:var(--am);direction:ltr;display:block}
